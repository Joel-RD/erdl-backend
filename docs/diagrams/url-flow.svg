<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1064 436" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="urlflow-title urlflow-desc">
      <title id="urlflow-title">Acortar y redirigir una URL</title>
      <desc id="urlflow-desc">Proceso de acortado y redirección: la API valida la URL contra protocolo anti-SSRF, genera un nanoid, la guarda en LibSQL y responde; luego la consulta del enlace corto hace el SELECT y devuelve un 302 con la ubicación original.</desc>
      <defs>
<style>
@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--paper:#f5f5f5;--ink:#2d3142;--muted:#4f5d75;--soft:#7a8399;--accent:#eb6c36;--accent-tint:rgba(235,108,54,.08);--rule:rgba(45,49,66,.12);--label-rule:rgba(45,49,66,.20);--lane:rgba(45,49,66,.018);--node:#fff;--node-stroke:rgba(45,49,66,.25);--chip:rgba(45,49,66,.12);--dot:rgba(45,49,66,.10);--db:#5e7a9b;--ls:#7c8f6f;--fl:#9c6b50;--tb:#b8915a;--wb:#6e6479;--sans:'Geist',system-ui,sans-serif;--serif:'Instrument Serif',serif;--mono:'Geist Mono',ui-monospace,monospace}
    body{font-family:var(--sans);background:var(--paper);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:3rem 2rem}
    .frame{max-width:1120px;width:100%}.eyebrow{font:500 .66rem var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem}h1{font:400 clamp(1.5rem,2.4vw + .75rem,2rem)/1.15 var(--serif);letter-spacing:-.02em;margin-bottom:1.5rem}svg{width:100%;min-width:1000px;display:block}
    svg text{font-family:var(--sans)}.mono{font-family:var(--mono)}.lane{fill:var(--lane)}.rule{stroke:var(--rule)}.label-rule{stroke:var(--label-rule)}.actor{fill:var(--muted);font:500 8px var(--mono);letter-spacing:.08em}.step-label{fill:var(--muted);font:500 6px var(--mono);letter-spacing:.12em}.step-chip{fill:var(--chip)}.step-num{fill:var(--ink);font:600 7px var(--mono)}.connector{fill:none;stroke:var(--muted);stroke-width:1}.connector.focal{stroke:var(--accent);stroke-width:1.2}.node-mask{fill:var(--paper)}.node{fill:var(--node);stroke:var(--node-stroke)}.node.focal{fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.2}.role{fill:rgba(45,49,66,.10)}.role.focal{fill:rgba(235,108,54,.25)}.role-text{fill:var(--ink);font:600 6px var(--mono)}.role-text.focal{fill:var(--accent)}.node-title{fill:var(--ink);font:600 9px var(--sans)}.node-sub{fill:var(--muted);font:6.5px var(--mono)}.node-tool{fill:var(--soft);font:6.5px var(--mono)}.data-text{fill:white;font:700 5px var(--mono)}.legend-key{fill:var(--muted);font:500 7px var(--mono);letter-spacing:.12em}.legend-text{fill:var(--muted);font:8px var(--sans)}
</style>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r="0.8" fill="var(--dot)"/></pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="var(--muted)"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="var(--accent)"/></marker>
        <marker id="arrow-sm" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto"><polygon points="0 0,6 2.5,0 5" fill="var(--muted)"/></marker>
      </defs>
      <rect width="1064" height="436" fill="var(--paper)"/><rect width="1064" height="436" fill="url(#dots)" opacity=".55"/>
      <rect class="lane" x="140" y="36" width="924" height="80"/><rect class="lane" x="140" y="196" width="924" height="80"/>
      <g class="rule" stroke-width=".8"><line x1="0" y1="36" x2="1064" y2="36"/><line x1="0" y1="116" x2="1064" y2="116"/><line x1="0" y1="196" x2="1064" y2="196"/><line x1="0" y1="276" x2="1064" y2="276"/><line x1="0" y1="356" x2="1064" y2="356"/></g>
      <line class="label-rule" x1="140" y1="36" x2="140" y2="356"/>
      <g class="actor" text-anchor="middle"><text x="70" y="80">CLIENTE</text><text x="70" y="160">API · ROUTERS</text><text x="70" y="240">SERVICIOS</text><text x="70" y="320">REPO · LIBSQL</text></g>
      <g text-anchor="middle">
        <rect class="step-chip" x="190" y="8" width="16" height="16" rx="8"/><text class="step-num" x="198" y="19">1</text><text class="step-label" x="198" y="32">ACORTAR</text>
        <rect x="302" y="8" width="16" height="16" rx="8" fill="rgba(235,108,54,.20)"/><text x="310" y="19" fill="var(--accent)" font-size="7" font-weight="600" class="mono">2</text><text x="310" y="32" fill="var(--accent)" font-size="6" font-weight="500" letter-spacing=".12em" class="mono">VALIDAR</text>
        <rect class="step-chip" x="414" y="8" width="16" height="16" rx="8"/><text class="step-num" x="422" y="19">3</text><text class="step-label" x="422" y="32">GENERAR</text>
        <rect class="step-chip" x="526" y="8" width="16" height="16" rx="8"/><text class="step-num" x="534" y="19">4</text><text class="step-label" x="534" y="32">GUARDAR</text>
        <rect class="step-chip" x="638" y="8" width="16" height="16" rx="8"/><text class="step-num" x="646" y="19">5</text><text class="step-label" x="646" y="32">RESPONDER</text>
        <rect class="step-chip" x="750" y="8" width="16" height="16" rx="8"/><text class="step-num" x="758" y="19">6</text><text class="step-label" x="758" y="32">REDIRIGIR</text>
        <rect class="step-chip" x="862" y="8" width="16" height="16" rx="8"/><text class="step-num" x="870" y="19">7</text><text class="step-label" x="870" y="32">BUSCAR</text>
        <rect class="step-chip" x="974" y="8" width="16" height="16" rx="8"/><text class="step-num" x="982" y="19">8</text><text class="step-label" x="982" y="32">RESULTADO</text>
      </g>
      <!-- Connectors: right exit, r=8 orthogonal bend, top/bottom entry. -->
      <path class="connector focal" d="M248 76 H302 Q310 76 310 84 V204" marker-end="url(#arrow-accent)"/><line class="connector focal" x1="360" y1="236" x2="372" y2="236" marker-end="url(#arrow-accent)"/><path class="connector" d="M472 236 H526 Q534 236 534 244 V284" marker-end="url(#arrow)"/><path class="connector" d="M584 316 H638 Q646 316 646 308 V124" marker-end="url(#arrow)"/><path class="connector" d="M696 156 H750 Q758 156 758 148 V44" stroke-dasharray="5,4" marker-end="url(#arrow)"/><path class="connector" d="M808 76 H862 Q870 76 870 84 V284" marker-end="url(#arrow)"/><path class="connector" d="M920 316 H974 Q982 316 982 308 V124" marker-end="url(#arrow)"/>
      <!-- Nodes -->
      <g text-anchor="middle">
        <g><rect class="node-mask" x="148" y="44" width="100" height="64" rx="6"/><rect class="node" x="148" y="44" width="100" height="64" rx="6"/><rect class="role" x="152" y="48" width="20" height="10" rx="2"/><text class="role-text" x="162" y="56">CLI</text><text class="node-title" x="198" y="70">Acortar URL</text><text class="node-sub" x="198" y="84">POST /short</text><text class="node-tool" x="198" y="96">frontend · fetch</text></g>
        <g><rect class="node-mask" x="260" y="204" width="100" height="64" rx="6"/><rect class="node focal" x="260" y="204" width="100" height="64" rx="6"/><rect class="role focal" x="264" y="208" width="20" height="10" rx="2"/><text class="role-text focal" x="274" y="216">SVC</text><text class="node-title" x="310" y="230">Validar anti-SSRF</text><text class="node-sub" x="310" y="244">URL externa ✓</text><text class="node-tool" x="310" y="256">protocol · redir</text></g>
        <g><rect class="node-mask" x="372" y="204" width="100" height="64" rx="6"/><rect class="node" x="372" y="204" width="100" height="64" rx="6"/><rect class="role" x="376" y="208" width="20" height="10" rx="2"/><text class="role-text" x="386" y="216">SVC</text><text class="node-title" x="422" y="230">Generar código</text><text class="node-sub" x="422" y="244">nanoid(8)</text><text class="node-tool" x="422" y="256">shortCode · unique</text></g>
        <g><rect class="node-mask" x="484" y="284" width="100" height="64" rx="6"/><rect class="node" x="484" y="284" width="100" height="64" rx="6"/><rect class="role" x="488" y="288" width="20" height="10" rx="2"/><text class="role-text" x="498" y="296">REPO</text><text class="node-title" x="534" y="310">Guardar</text><text class="node-sub" x="534" y="324">INSERT urls</text><text class="node-tool" x="534" y="336">libsql</text><rect x="564" y="338" width="16" height="8" rx="2" fill="var(--db)"/><text class="data-text" x="572" y="344">DB</text></g>
        <g><rect class="node-mask" x="596" y="124" width="100" height="64" rx="6"/><rect class="node" x="596" y="124" width="100" height="64" rx="6"/><rect class="role" x="600" y="128" width="20" height="10" rx="2"/><text class="role-text" x="610" y="136">API</text><text class="node-title" x="646" y="150">Responder</text><text class="node-sub" x="646" y="164">200 · url corta</text><text class="node-tool" x="646" y="176">json · contrato</text></g>
        <g><rect class="node-mask" x="708" y="44" width="100" height="64" rx="6"/><rect class="node" x="708" y="44" width="100" height="64" rx="6"/><rect class="role" x="712" y="48" width="20" height="10" rx="2"/><text class="role-text" x="722" y="56">CLI</text><text class="node-title" x="758" y="70">Redirigir</text><text class="node-sub" x="758" y="84">GET /:shortUrl</text><text class="node-tool" x="758" y="96">click · enlace</text></g>
        <g><rect class="node-mask" x="820" y="284" width="100" height="64" rx="6"/><rect class="node" x="820" y="284" width="100" height="64" rx="6"/><rect class="role" x="824" y="288" width="20" height="10" rx="2"/><text class="role-text" x="834" y="296">REPO</text><text class="node-title" x="870" y="310">Buscar</text><text class="node-sub" x="870" y="324">SELECT urls</text><text class="node-tool" x="870" y="336">shortUrl → row</text><rect x="900" y="338" width="16" height="8" rx="2" fill="var(--db)"/><text class="data-text" x="908" y="344">DB</text></g>
        <g><rect class="node-mask" x="932" y="124" width="100" height="64" rx="6"/><rect class="node" x="932" y="124" width="100" height="64" rx="6"/><rect class="role" x="936" y="128" width="20" height="10" rx="2"/><text class="role-text" x="946" y="136">API</text><text class="node-title" x="982" y="150">Resultado</text><text class="node-sub" x="982" y="164">302 · Location</text><text class="node-tool" x="982" y="176">redirect · segura</text></g>
      </g>
      <!-- Three-row type key -->
      <g><text class="legend-key" x="144" y="372">STEPS</text><g text-anchor="middle"><rect class="step-chip" x="168" y="364" width="16" height="16" rx="8"/><text class="step-num" x="176" y="375">1</text><text class="legend-text" x="196" y="375">ACORTAR</text><rect x="264" y="364" width="16" height="16" rx="8" fill="rgba(235,108,54,.20)"/><text x="272" y="375" fill="var(--accent)" font-size="7" class="mono">2</text><text x="292" y="375" fill="var(--accent)" font-size="8">VALIDAR</text><rect class="step-chip" x="360" y="364" width="16" height="16" rx="8"/><text class="step-num" x="368" y="375">3</text><text class="legend-text" x="388" y="375">GENERAR</text><rect class="step-chip" x="456" y="364" width="16" height="16" rx="8"/><text class="step-num" x="464" y="375">4</text><text class="legend-text" x="484" y="375">GUARDAR</text><rect class="step-chip" x="552" y="364" width="16" height="16" rx="8"/><text class="step-num" x="560" y="375">5</text><text class="legend-text" x="580" y="375">RESPONDER</text><rect class="step-chip" x="660" y="364" width="16" height="16" rx="8"/><text class="step-num" x="668" y="375">6</text><text class="legend-text" x="688" y="375">REDIRIGIR</text><rect class="step-chip" x="764" y="364" width="16" height="16" rx="8"/><text class="step-num" x="772" y="375">7</text><text class="legend-text" x="792" y="375">BUSCAR</text><rect class="step-chip" x="856" y="364" width="16" height="16" rx="8"/><text class="step-num" x="864" y="375">8</text><text class="legend-text" x="884" y="375">RESULTADO</text></g>
      <text class="legend-key" x="144" y="393">DATA TYPE</text><rect x="220" y="386" width="16" height="8" rx="2" fill="var(--db)"/><text class="legend-text" x="244" y="393">DB · registros en libsql</text><rect x="380" y="386" width="16" height="8" rx="2" fill="rgba(235,108,54,.20)"/><text class="legend-text" x="404" y="393">Focal · validación crítica</text>
      <text class="legend-key" x="144" y="414">FLOW</text><line x1="200" y1="410" x2="228" y2="410" stroke="var(--accent)" stroke-width="1.2" marker-end="url(#arrow-accent)"/><text class="legend-text" x="240" y="414">Validación crítica</text><line x1="372" y1="410" x2="400" y2="410" stroke="var(--muted)" marker-end="url(#arrow)"/><text class="legend-text" x="412" y="414">Secuencial</text><line x1="520" y1="410" x2="548" y2="410" stroke="var(--muted)" stroke-dasharray="5,4" marker-end="url(#arrow)"/><text class="legend-text" x="560" y="414">Disparo posterior</text></g>
    </svg>
