<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 848" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="authflow-title authflow-desc">
      <title id="authflow-title">Autenticación en 3 pasos con verificación por email</title>
      <desc id="authflow-desc">Secuencia de autenticación: el navegador registra o inicia sesión, recibe un código por email, verifica y obtiene el JWT de sesión (header Authorization: Bearer) para acceder a rutas protegidas.</desc>
      <defs>
<style>
@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');
</style>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
        </pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <!-- Lifelines -->
      <line x1="124" y1="128" x2="124" y2="760" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="324" y1="128" x2="324" y2="760" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="524" y1="128" x2="524" y2="760" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="724" y1="128" x2="724" y2="760" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="900" y1="128" x2="900" y2="760" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- Activation bars -->
      <rect x="320" y="180" width="8" height="236" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="520" y="228" width="8" height="92" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

      <!-- Messages (time flows top → down) -->
      <!-- M1 -->
      <line x1="124" y1="176" x2="324" y2="176" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- M2 -->
      <line x1="324" y1="224" x2="524" y2="224" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- M3 -->
      <line x1="524" y1="272" x2="900" y2="272" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- M4 -->
      <line x1="524" y1="320" x2="724" y2="320" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- M5 (async email) -->
      <line x1="724" y1="368" x2="124" y2="368" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
      <!-- M6 (return) -->
      <line x1="324" y1="416" x2="124" y2="416" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <!-- M7 -->
      <line x1="124" y1="464" x2="324" y2="464" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- M8 -->
      <line x1="324" y1="512" x2="524" y2="512" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- M9 -->
      <line x1="524" y1="560" x2="900" y2="560" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- M10 (headline coral) -->
      <line x1="324" y1="608" x2="124" y2="608" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- M11 -->
      <line x1="124" y1="656" x2="324" y2="656" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- M12 (return) -->
      <line x1="324" y1="704" x2="124" y2="704" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

      <!-- Message labels (masked) -->
      <rect x="172" y="156" width="104" height="12" rx="2" fill="#f5f5f5"/>
      <text x="224" y="166" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">POST /AUTH/REGISTER</text>

      <rect x="396" y="204" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="424" y="214" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REGISTRAR()</text>

      <rect x="664" y="252" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="712" y="262" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">INSERT USER + CODE</text>

      <rect x="572" y="300" width="104" height="12" rx="2" fill="#f5f5f5"/>
      <text x="624" y="310" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ENVIAR CÓDIGO()</text>

      <rect x="380" y="348" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="424" y="358" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EMAIL · CÓDIGO 6</text>

      <rect x="168" y="396" width="112" height="12" rx="2" fill="#f5f5f5"/>
      <text x="224" y="406" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">201 · COOKIE TEMPORAL</text>

      <rect x="168" y="444" width="112" height="12" rx="2" fill="#f5f5f5"/>
      <text x="224" y="454" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">POST /AUTH/VERIFY-EMAIL</text>

      <rect x="376" y="492" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="424" y="502" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">VERIFICAR CÓDIGO()</text>

      <rect x="668" y="540" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="712" y="550" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SELECT + UPDATE</text>

      <rect x="172" y="588" width="104" height="12" rx="2" fill="#f5f5f5"/>
      <text x="224" y="598" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">200 · TOKEN JWT</text>

      <rect x="176" y="636" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="224" y="646" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GET /USER/PROFILE</text>

      <rect x="196" y="684" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="224" y="694" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">200 · PERFIL</text>

      <!-- Actors -->
      <rect x="52" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="52" y="72" width="144" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="60" y="80" width="28" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="74" y="89" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
      <text x="124" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Navegador</text>
      <text x="124" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">frontend</text>

      <rect x="252" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="252" y="72" width="144" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="260" y="80" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="274" y="89" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
      <text x="324" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Express API</text>
      <text x="324" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">routers · mw · ctrl</text>

      <rect x="452" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="452" y="72" width="144" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="460" y="80" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="474" y="89" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SVC</text>
      <text x="524" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">AuthService</text>
      <text x="524" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">lógica · JWT</text>

      <rect x="652" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="652" y="72" width="144" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="660" y="80" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
      <text x="676" y="89" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SMTP</text>
      <text x="724" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">nodemailer</text>
      <text x="724" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">enviar email</text>

      <rect x="828" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="828" y="72" width="144" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="836" y="80" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="850" y="89" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
      <text x="900" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">LibSQL · Turso</text>
      <text x="900" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">users · códigos</text>

      <!-- Legend -->
      <line x1="52" y1="784" x2="972" y2="784" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="52" y="800" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <line x1="52" y1="824" x2="80" y2="824" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="88" y="824" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Petición HTTP</text>

      <line x1="232" y1="824" x2="260" y2="824" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="268" y="824" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Llamada interna</text>

      <line x1="416" y1="824" x2="444" y2="824" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="452" y="824" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Respuesta · return</text>

      <line x1="600" y1="824" x2="628" y2="824" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
      <text x="636" y="824" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Async · email</text>

      <line x1="774" y1="824" x2="802" y2="824" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="810" y="824" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Éxito principal</text>
    </svg>
