<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arquitectura · Diagram Design</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1300px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1rem;
    }

    .subtitle {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Diagram Design</p>
    <h1>Arquitectura del backend ERDL</h1>
    <p class="subtitle">Capas: Router → Controller → Service → Repository → LibSQL</p>

    <svg viewBox="0 0 1264 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="arch-title arch-desc">
      <title id="arch-title">Arquitectura del backend ERDL</title>
      <desc id="arch-desc">Diagrama de arquitectura que muestra una petición del navegador atravesando middleware de seguridad, routers, controllers y services hasta el repositorio y LibSQL, con el envío de email por nodemailer.</desc>

        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <!-- Zones (behind everything) -->

      <rect x="216" y="240" width="640" height="120" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>

      <text x="274" y="253" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">API · EXPRESS</text>

      <rect x="880" y="240" width="356" height="120" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>

      <!-- Arrow labels (masked) -->
      <rect x="180" y="284" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="200" y="294" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HTTPS</text>

      <rect x="850" y="284" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="872" y="294" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">QUERY</text>

      <rect x="1048" y="284" width="32" height="12" rx="2" fill="#f5f5f5"/>

      <rect x="672" y="200" width="88" height="12" rx="2" fill="#f5f5f5"/>

      <text x="616" y="324" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">req/res · validación</text>

      <!-- Node: Services -->
      <rect x="712" y="272" width="128" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="712" y="272" width="128" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>

      <text x="776" y="324" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">lógica · JWT</text>

      <!-- Node: Repository (store) -->
      <rect x="904" y="272" width="128" height="64" rx="6" fill="#f5f5f5"/>

      <line x1="40" y1="392" x2="1224" y2="392" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>

      <rect x="340" y="428" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="360" y="436" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Store</text>

      <rect x="460" y="428" width="14" height="10" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="480" y="436" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Externo</text>

      <rect x="600" y="428" width="14" height="10" rx="2" fill="rgba(235,108,54,0.05)" stroke="rgba(235,108,54,0.50)" stroke-width="1" stroke-dasharray="3,2"/>

  </div>
</body>
</html>
