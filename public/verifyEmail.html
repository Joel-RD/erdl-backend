<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Verifica tu correo electrónico para activar tu cuenta en Erdl.my.">
    <title>Erdl.my - Verificar Email</title>
    <link rel="stylesheet" href="/static/css/common.css">
    <link rel="stylesheet" href="/static/css/verifyEmail.css">
</head>

<body>
    <div class="bg-grid" aria-hidden="true"></div>
    <div class="floating-particles" id="particles" aria-hidden="true"></div>

    <main class="container_auth">
        <section class="auth-box">
            <header class="auth-header">
                <h1>Erdl.my.</h1>
                <p>Verificar Email</p>
            </header>

            <div id="verifyEmailFormContainer" class="form-container_auth active">
                <form id="verify-form">
                    <div class="form-group">
                        <label for="code">Código de validación</label>
                        <div class="input-wrapper">
                            <svg viewBox="0 0 24 24" fill="currentColor" class="input-icon" aria-hidden="true">
                                <path
                                    d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z" />
                            </svg>
                            <input type="text" id="code" name="code" required placeholder="Ingresa el código"
                                autocomplete="one-time-code">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary" id="submit-verify">
                        Enviar
                    </button>
                </form>
            </div>

            <hr class="footer-separator" aria-hidden="true">

            <footer class="footer-links">
                <a href="#" class="footer-link">
                    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <path d="M7 2v11h3v9l7-12h-4l4-8z" />
                    </svg>
                    RÁPIDO
                </a>
                <a href="#" class="footer-link">
                    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <path
                            d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z" />
                    </svg>
                    SEGURO
                </a>
                <a href="/auth" class="footer-link">
                    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <path
                            d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" />
                    </svg>
                    REGISTRO
                </a>
            </footer>

            <div id="alert-container" aria-live="assertive"></div>
        </section>
    </main>

    <script src="/static/js/utils/particles.js"></script>
    <script src="/static/js/utils/validation.js"></script>
    <script src="/static/js/utils/cookieUtils.js"></script>
    <script src="/static/js/verifyEmail.js"></script>
</body>

</html>
