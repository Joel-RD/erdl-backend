<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Página No Encontrada</title>
    <link rel="stylesheet" href="/static/css/error.css">
</head>

<body>
    <div class="stars-container"></div>


    <div class="planet"></div>


    <svg class="astronaut" viewBox="0 0 200 200">
        <defs>
            <linearGradient id="astronaut-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#fff;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#e0e0e0;stop-opacity:1" />
            </linearGradient>
        </defs>

        <ellipse cx="100" cy="120" rx="40" ry="50" fill="url(#astronaut-gradient)" />

        <circle cx="100" cy="70" r="35" fill="url(#astronaut-gradient)" />
        <circle cx="100" cy="70" r="28" fill="rgba(100, 150, 255, 0.3)" />

        <rect x="60" y="110" width="15" height="40" rx="7" fill="url(#astronaut-gradient)" />
        <rect x="125" y="110" width="15" height="40" rx="7" fill="url(#astronaut-gradient)" />

        <rect x="80" y="160" width="15" height="35" rx="7" fill="url(#astronaut-gradient)" />
        <rect x="105" y="160" width="15" height="35" rx="7" fill="url(#astronaut-gradient)" />

        <rect x="85" y="125" width="30" height="25" rx="5" fill="#ff6b6b" />
    </svg>

    <div class="container">
        <h1 class="error-code">404</h1>
        <h2 class="error-message">¡Oops! Página no encontrada</h2>
        <p class="error-description">
            Parece que te has perdido en el espacio digital.<br>
            La página que buscas no existe o ha sido movida.
        </p>
        <a href="/home" class="btn-home">Volver al Inicio</a>
    </div>

    <script>
        const starsContainer = document.querySelector('.stars-container');
        for (let i = 0; i < 100; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDelay = Math.random() * 3 + 's';
            starsContainer.appendChild(star);
        }
    </script>
</body>

</html>
