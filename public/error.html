<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Página No Encontrada | Erdl.my</title>
    <link rel="stylesheet" href="/static/css/error.css">
</head>

<body>
    <div class="bg-grid"></div>
    
    <div class="floating-particles" id="particles"></div>

    <div class="container">
        <div class="broken-link-icon">
            <svg viewBox="0 0 100 100">
                <g class="link-left">
                    <path d="M35 50 L20 50 C10 50 5 42 5 35 C5 28 10 20 20 20 L35 20 L35 30 L20 30 C16 30 15 33 15 35 C15 37 16 40 20 40 L35 40 Z"/>
                </g>
                <g class="link-right">
                    <path d="M65 50 L80 50 C90 50 95 58 95 65 C95 72 90 80 80 80 L65 80 L65 70 L80 70 C84 70 85 67 85 65 C85 63 84 60 80 60 L65 60 Z"/>
                </g>
                <circle class="spark" cx="50" cy="35" r="3"/>
                <circle class="spark" cx="45" cy="45" r="2"/>
                <circle class="spark" cx="55" cy="42" r="2.5"/>
            </svg>
        </div>

        <h1 class="error-code">404</h1>
        <h2 class="error-message">Enlace Roto</h2>
        <p class="error-description">
            La URL que buscas no existe o ha sido<br>
            <span>desconectada</span> del sistema.
        </p>

        <a href="/home" class="btn-home">
            <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z"/>
            </svg>
            Volver al Inicio
        </a>

        <div class="error-meta">
            <p>ERR_LINK_NOT_FOUND</p>
        </div>
    </div>

    <script>
        const particlesContainer = document.getElementById('particles');
        const particleCount = 15;
        
        for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.top = Math.random() * 100 + '%';
            particle.style.animationDelay = Math.random() * 15 + 's';
            particle.style.animationDuration = (12 + Math.random() * 8) + 's';
            particlesContainer.appendChild(particle);
        }
    </script>
</body>

</html>
