<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Erdl.my - El acortador de URLs más rápido y seguro.">
    <title>Erdl.my - URL Shortener</title>
    <link rel="stylesheet" href="/static/css/common.css">
    <link rel="stylesheet" href="/static/css/index.css">
</head>

<body>
    <div class="bg-grid" aria-hidden="true"></div>
    <div class="floating-particles" id="particles" aria-hidden="true"></div>

    <main class="container">
        <header class="header">
            <h1>Erdl.my.</h1>
            <p>Acorta tus enlaces de forma rápida</p>
        </header>

        <section id="shorten-section">
            <h2 class="sr-only">Formulario para acortar URL</h2>
            <form id="shorten-form">
                <div class="form-group">
                    <label for="orig_url">URL Original</label>
                    <div class="url-input-wrapper">
                        <svg class="link-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                            <path
                                d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z" />
                        </svg>
                        <input type="url" id="orig_url" name="orig_url" placeholder="https://google.com" required>
                    </div>
                </div>

                <button type="submit" class="submit-btn" id="submit-btn">
                    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z" />
                    </svg>
                    <span>Acortar Url</span>
                </button>
            </form>
        </section>

        <section class="result-section" id="result" aria-live="polite">
            <div id="error" class="error-msg"></div>
            <div id="qrcode" class="qr-container"></div>
        </section>

        <hr class="footer-separator" aria-hidden="true">

        <footer class="footer-links">
            <a href="#" class="footer-link">
                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path d="M7 2v11h3v9l7-12h-4l4-8z" />
                </svg>
                RÁPIDO
            </a>
            <a href="#" class="footer-link">
                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path
                        d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z" />
                </svg>
                SEGURO
            </a>
            <a href="/auth" class="footer-link">
                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path
                        d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" />
                </svg>
                REGISTRO
            </a>
        </footer>
    </main>

    <script src="/static/js/utils/particles.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="/static/js/index.js"></script>
</body>

</html>
